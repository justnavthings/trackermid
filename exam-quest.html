<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXAM QUEST — Semester 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#fcf9f1;
    --cream-dim:#f1eee5;
    --cream-high:#e5e2da;
    --onyx:#1a1a17;
    --onyx-soft:#5f5e5a;
    --cobalt:#0047ab;
    --cobalt-deep:#00327d;
    --line-soft:#3a3a35;
  }
  [data-theme="dark"]{
    --cream:#111110;
    --cream-dim:#1a1a18;
    --cream-high:#26251f;
    --onyx:#f4f0e6;
    --onyx-soft:#9c988c;
    --cobalt:#5b8dee;
    --cobalt-deep:#7fa4f0;
    --line-soft:#3a3a35;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--onyx);
    font-family:'Hanken Grotesk',Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .2s ease, color .2s ease;
  }
  ::selection{background:var(--cobalt);color:var(--cream);}
  button,input,select{font-family:inherit;}

  .edge{padding-left:24px;padding-right:24px;}
  @media(min-width:900px){ .edge{padding-left:56px;padding-right:56px;} }

  .rule{border-top:1px solid var(--onyx);}
  .rule-b{border-bottom:1px solid var(--onyx);}

  .label{ font-size:11px; font-weight:700; letter-spacing:0.14em; color:var(--onyx-soft); }
  .label-accent{ color:var(--cobalt); }

  .display{ font-weight:900; letter-spacing:-0.045em; line-height:0.86; margin:0; text-transform:uppercase; }
  .display-xl{ font-size:clamp(48px,12vw,120px); }
  .display-lg{ font-size:clamp(32px,7.5vw,60px); }
  .display-md{ font-size:clamp(24px,4.5vw,34px); }

  .num{ font-weight:900; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }

  #app{ min-height:100vh; padding-bottom:120px; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding-top:22px; padding-bottom:22px; gap:16px; flex-wrap:wrap; }
  header.topbar .wordmark{ font-weight:900; font-size:20px; letter-spacing:-0.02em; }
  nav.desktop-nav{ display:none; gap:24px; align-items:center; }
  @media(min-width:900px){ nav.desktop-nav{ display:flex; } }
  nav.desktop-nav a{ font-size:11px; font-weight:700; letter-spacing:0.14em; color:var(--onyx-soft); text-decoration:none; cursor:pointer; padding-bottom:4px; border-bottom:2px solid transparent; }
  nav.desktop-nav a.active{ color:var(--onyx); border-bottom-color:var(--cobalt); }

  .theme-toggle{
    display:flex; align-items:center; gap:8px; border:1px solid var(--onyx); background:none;
    color:var(--onyx); padding:7px 12px; cursor:pointer; font-size:10px; font-weight:700; letter-spacing:0.1em;
  }

  section.block{ padding-top:52px; padding-bottom:52px; }
  @media(min-width:900px){ section.block{ padding-top:72px; padding-bottom:72px; } }

  .grid12{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  @media(min-width:900px){ .grid12{ grid-template-columns:repeat(12,1fr); gap:24px; } }
  .c-4{ grid-column: span 4; }
  .c-8-md{ grid-column: span 4; }
  .c-4-md{ grid-column: span 4; }
  @media(min-width:900px){ .c-8-md{ grid-column: span 8; } .c-4-md{ grid-column: span 4; } }

  .row{
    display:flex; align-items:center; gap:14px; padding:16px 2px;
    border-bottom:1px solid var(--onyx); background:transparent;
    transition:background .12s ease, color .12s ease;
  }
  .row:hover{ background:var(--cream-high); }
  .row .rn{ width:30px; flex-shrink:0; font-size:18px; }
  .row .rt{ flex-grow:1; cursor:pointer; min-width:0; }
  .row .rt .name{ font-weight:800; text-transform:uppercase; font-size:15px; line-height:1.25; }
  .row .rt .status{ font-size:10px; font-weight:700; letter-spacing:0.1em; color:var(--onyx-soft); margin-top:6px; text-transform:uppercase; }
  .row.st-complete .rt .status{ color:var(--cobalt); }
  .row.st-in_progress .rt .name{ color:var(--cobalt); }
  .row.st-in_progress .rn{ color:var(--cobalt); }
  .row.st-partial .rt .name{ opacity:.75; }
  .row .redit{ opacity:0; transition:opacity .12s ease; font-size:16px; cursor:pointer; padding:6px; flex-shrink:0; color:var(--onyx-soft); }
  .row:hover .redit{ opacity:1; }
  @media(max-width:640px){ .row .redit{ opacity:.55; } }

  .checkbox{
    width:22px; height:22px; flex-shrink:0; border:1.6px solid var(--onyx);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:none;
  }
  .checkbox.checked{ background:var(--cobalt); border-color:var(--cobalt); }
  .checkbox svg{ width:13px; height:13px; stroke:var(--cream); fill:none; stroke-width:3; opacity:0; transition:opacity .1s ease; }
  .checkbox.checked svg{ opacity:1; }

  .bar{ width:100%; height:4px; background:var(--cream-high); }
  .bar > div{ height:100%; background:var(--cobalt); transition:width .5s cubic-bezier(.4,0,.2,1); }

  .day-picker{ display:flex; gap:0; overflow-x:auto; }
  .day-btn{ border:none; background:none; cursor:pointer; padding:14px 22px 14px 0; margin-right:22px; font-size:15px; }
  .day-btn .n{ font-size:32px; font-weight:900; letter-spacing:-0.03em; color:var(--cream-high); transition:color .15s ease; }
  .day-btn.active .n{ color:var(--onyx); }
  .day-btn.active{ border-bottom:3px solid var(--cobalt); }
  .day-btn .dl{ display:block; font-size:10px; font-weight:700; letter-spacing:0.1em; margin-top:2px; color:var(--onyx-soft); }

  .pill{ display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.1em; padding:5px 10px; border:1px solid var(--onyx); background:none; color:var(--onyx); cursor:pointer;}
  .pill-accent{ border-color:var(--cobalt); color:var(--cobalt); }
  .pill-fill{ background:var(--onyx); color:var(--cream); border-color:var(--onyx); }
  .pill.active{ background:var(--cobalt); border-color:var(--cobalt); color:var(--cream); }

  nav.bottom-nav{ position:fixed; left:0; bottom:0; width:100%; display:flex; background:var(--cream); border-top:1px solid var(--onyx); z-index:50; }
  @media(min-width:900px){ nav.bottom-nav{ display:none; } }
  nav.bottom-nav button{ flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 4px 8px; gap:4px; color:var(--onyx-soft); border-top:3px solid transparent; }
  nav.bottom-nav button.active{ color:var(--cobalt); border-top-color:var(--cobalt); }
  nav.bottom-nav svg{ width:18px; height:18px; }
  nav.bottom-nav .bn-num{ font-size:12px; font-weight:900; }

  .subj-progress-row{ display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--cream-high); }
  .subj-progress-row:last-child{ border-bottom:none; }
  .subj-progress-row .code{ width:56px; font-weight:900; font-size:14px; flex-shrink:0; }
  .subj-progress-row .barwrap{ flex-grow:1; }
  .subj-progress-row .pct{ width:52px; text-align:right; font-weight:900; font-size:14px; }

  .backlog-band{ background:var(--onyx); color:var(--cream); padding:26px 20px; }
  [data-theme="dark"] .backlog-band{ background:var(--cobalt); color:#0d1220; }
  .backlog-band .display-md{ color:inherit; }

  a.reset-link, .textlink{ color:var(--onyx-soft); font-size:11px; letter-spacing:0.1em; font-weight:700; text-decoration:underline; cursor:pointer; text-transform:uppercase;}

  .critical-hero{ background:var(--cobalt); color:var(--cream); }
  .critical-hero .display-xl{ color:var(--cream); }
  .critical-hero .label{ color:#c9d9f5; }
  [data-theme="dark"] .critical-hero{ color:#0d1220; }
  [data-theme="dark"] .critical-hero .display-xl{ color:#0d1220; }
  [data-theme="dark"] .critical-hero .label{ color:#1b2440; }

  .fade-in{ animation:fadeIn .3s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .subj-card{ border-bottom:1px solid var(--onyx); }
  .subj-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 0; cursor:pointer; }
  .subj-head .l{ display:flex; flex-direction:column; gap:6px; }
  .subj-stats{ display:flex; gap:18px; align-items:baseline; }
  .subj-body{ overflow:hidden; max-height:0; transition:max-height .25s ease; }
  .subj-body.open{ max-height:4000px; }
  .chev{ font-size:20px; transition:transform .2s ease; flex-shrink:0; }
  .chev.open{ transform:rotate(180deg); }

  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:28px; }
  .search-input{
    flex-grow:1; min-width:180px; border:none; border-bottom:1.5px solid var(--onyx);
    background:none; color:var(--onyx); font-size:15px; padding:10px 2px; outline:none;
  }
  .search-input::placeholder{ color:var(--onyx-soft); }
  select.plain{
    border:1px solid var(--onyx); background:var(--cream); color:var(--onyx);
    padding:9px 10px; font-size:11px; font-weight:700; letter-spacing:0.08em; cursor:pointer;
  }

  .btn{
    border:1px solid var(--onyx); background:var(--onyx); color:var(--cream);
    padding:10px 18px; font-size:11px; font-weight:700; letter-spacing:0.1em; cursor:pointer;
  }
  .btn-ghost{ background:none; color:var(--onyx); }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:700px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--cream); color:var(--onyx); width:100%; max-width:520px;
    padding:32px 24px; max-height:92vh; overflow-y:auto; border-top:1px solid var(--onyx);
  }
  @media(min-width:700px){ .modal{ border:1px solid var(--onyx); } }
  .modal h3{ margin:0 0 24px; font-weight:900; text-transform:uppercase; letter-spacing:-0.02em; font-size:24px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:10px; font-weight:700; letter-spacing:0.1em; color:var(--onyx-soft); margin-bottom:8px; }
  .field input[type=text], .field select{
    width:100%; border:1px solid var(--onyx); background:var(--cream); color:var(--onyx);
    padding:11px 12px; font-size:15px; outline:none;
  }
  .modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:28px; }
  .modal-actions .right{ display:flex; gap:10px; }

  @media(prefers-reduced-motion: reduce){ .fade-in{ animation:none; } .bar > div{ transition:none; } }
</style>

<body>
<div id="app"></div>

<script>
/* ============================= DATA ============================= */

const SUBJECT_META = {
  PS:  { name: "Probability and Statistics" },
  DS:  { name: "Data Structures" },
  AFL: { name: "Automata Theory & Formal Languages" },
  DSD: { name: "Digital Systems Design" },
  STW: { name: "Scientific & Technical Writing" },
  I40: { name: "Industry 4.0" },
};

const DAY_META = {
  1: { label: "FOUNDATION", mission: "FOUNDATION + HIGH PRIORITY" },
  2: { label: "CORE CONCEPTS", mission: "CORE CONCEPTS" },
  3: { label: "APPLICATIONS", mission: "APPLICATIONS" },
  4: { label: "FINISH", mission: "FINISH THE SYLLABUS" },
  5: { label: "CRITICAL", mission: "CRITICAL — EXAM PREP" },
};

const RAW_DAYS = {
  1: {
    PS: ["Sample Spaces & Events","Axioms of Probability","Properties of Probability","Conditional Probability","Bayes' Theorem","Independent Events"],
    DS: ["Introduction","Algorithm Basics","Complexity Analysis","Arrays","Array Operations","Sparse Matrices"],
    AFL: ["Alphabets","Strings","Languages","Automata Basics","DFA","DFA Examples and Construction"],
    DSD: ["Digital System Basics","Number Systems","Binary Representation","Binary Arithmetic","Binary Codes"],
  },
  2: {
    PS: ["Random Variable","Discrete Random Variable","Continuous Random Variable","Probability Mass Function","Cumulative Distribution Function","Parameters of Distribution","Geometric Distribution","Expected Value","Variance","Standard Deviation"],
    DS: ["Singly Linked List","Doubly Linked List","Circular Linked List","Operations on Linked Lists","Dynamic Storage Management"],
    AFL: ["NFA","Epsilon NFA","NFA to DFA Conversion","Epsilon NFA Conversions","DFA Minimization"],
    DSD: ["Boolean Algebra","Boolean Laws","SOP","POS","Boolean Expression Simplification","K-Map","Universal Gates"],
  },
  3: {
    PS: ["Expected Value and Variance of Linear Functions","Moments","Central Moments","Moment Generating Function","Binomial Distribution","Hypergeometric Distribution","Negative Binomial Distribution","Poisson Distribution","Poisson Process"],
    DS: ["Stack ADT","Stack Operations","Stack Applications","Expression Conversion","Expression Evaluation","Introduction to Queue","Queue Applications","Queue using Arrays","Queue using Linked Lists","Queue ADT"],
    AFL: ["Regular Expressions","Algebraic Laws","Regular Languages","Regular Expression to Finite Automata","Finite Automata to Regular Expression"],
    STW: ["Forms and Features of Writing","Audience Types","Technical Communication","Professional Communication","Scientific Communication","Accuracy","Clarity","Conciseness","Coherence","Appropriateness","Readability"],
  },
  4: {
    DS: ["Linear Queue","Drawbacks of Linear Queue","Circular Queue","Deque","Deque Operations","Priority Queue"],
    AFL: ["Closure Properties of Regular Languages","Pumping Lemma","Pumping Lemma Applications","Pumping Lemma Proofs"],
    DSD: ["Adders","Subtractors","Code Converters","Decoder","Encoder"],
    I40: ["Evolution of Industrial Revolutions","Industry 4.0 Environment","Industry 4.0 Design Principles","Artificial Intelligence","Big Data and Analytics","Data Visualization","Cyber Physical Systems","Cloud Computing","Fog Computing","Blockchain","Cybersecurity"],
    STW: ["Punctuation","Mechanics","Latin Terms","Informal English","Colloquial English","Dangling Modifiers","Faulty Parallelism","Common Words and Phrases","Active Voice","Passive Voice","Nominalization","Common English Errors","Pitfalls in Writing","Adapting Texts to Gender, Race and Ethnicity"],
  },
};

const EXAM_SCHEDULE = [
  { date:"07", month:"SEPTEMBER", subject:"Probability & Statistics", code:"MA21001" },
  { date:"08", month:"SEPTEMBER", subject:"Data Structures", code:"CS21001" },
  { date:"09", month:"SEPTEMBER", subject:"Automata Theory & Formal Languages", code:"CS21003" },
];

const PRIORITY_5 = [
  { code:"PS", label:"FIRST EXAM" },
  { code:"DS", label:"NEXT EXAM" },
  { code:"AFL", label:"HIGH PRIORITY" },
];

/* =============================================================
   CONFIG — fill these in to enable Google sign-in + sheet sync.
   1) GOOGLE_CLIENT_ID: OAuth Client ID from Google Cloud Console
      (APIs & Services → Credentials → Create OAuth client ID →
      Web application → add your site's URL to Authorized
      JavaScript origins).
   2) SHEETS_WEBAPP_URL: the /exec URL you get after deploying the
      companion Apps Script (see exam-quest-appsscript.gs) as a
      Web App, "Execute as: Me", "Who has access: Anyone".
   Leave either blank and that feature is skipped gracefully —
   the app still works fully offline on this device.
============================================================= */
const CONFIG = {
  GOOGLE_CLIENT_ID: "",
  SHEETS_WEBAPP_URL: "",
};

const STATUS_ORDER = ["not_started","in_progress","partial","complete"];
const STATUS_LABELS = { not_started:"NOT STARTED", in_progress:"IN PROGRESS", partial:"PARTIALLY COMPLETE", complete:"COMPLETED" };

function buildDefaultTopics(){
  const list = [];
  let seq = 0;
  Object.keys(RAW_DAYS).forEach(day => {
    const subjects = RAW_DAYS[day];
    Object.keys(subjects).forEach(code => {
      subjects[code].forEach(name => {
        seq++;
        list.push({ id:"t"+seq, day:Number(day), code, name, status:"not_started", priority:"normal" });
      });
    });
  });
  return list;
}

/* ============================= STATE ============================= */
const state = {
  route: "home",
  activeDay: 1,
  theme: "dark",
  topics: buildDefaultTopics(),
  modal: null,           // {mode:'edit'|'new', topic:{...}} | null
  syllabusExpanded: {},  // code -> bool
  search: "",
  filter: "all",         // all | complete | in_progress | incomplete
  subjectFilter: "all",
  ready: false,
  user: null,       // {email, name} once signed in with Google
  syncing: false,
  lastSynced: null,
};

const STORE_KEY = "examquest:v1";

async function loadState(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      if(saved.topics && Array.isArray(saved.topics) && saved.topics.length) state.topics = saved.topics;
      if(saved.theme) state.theme = saved.theme;
      if(saved.user) state.user = saved.user;
    }
  }catch(e){ /* no saved data yet */ }
  state.ready = true;
  applyTheme();
  render();
  if(state.user) await loadFromSheet();
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify({ topics: state.topics, theme: state.theme, user: state.user }), false);
  }catch(e){ console.error("save failed", e); }
  syncToSheet();
}

/* ---------- Google sign-in ---------- */
function decodeJwt(token){
  try{
    const base = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(base))));
  }catch(e){ return null; }
}

function handleGoogleCredential(response){
  const payload = decodeJwt(response.credential);
  if(!payload) return;
  state.user = { email: payload.email, name: payload.name || payload.email, picture: payload.picture || "" };
  saveState();
  loadFromSheet().then(render);
}

function initGoogleAuth(){
  if(!CONFIG.GOOGLE_CLIENT_ID || !window.google || !window.google.accounts) return;
  google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
  ["gsi-button","gsi-button-settings"].forEach(id => {
    const el = document.getElementById(id);
    if(el) google.accounts.id.renderButton(el, { theme: state.theme==="dark" ? "filled_black" : "outline", size: "medium", shape: "pill", text: "signin" });
  });
}

function signOut(){
  state.user = null;
  saveState();
  render();
}

/* ---------- Google Sheets sync (via Apps Script web app) ---------- */
async function syncToSheet(){
  if(!CONFIG.SHEETS_WEBAPP_URL || !state.user) return;
  state.syncing = true;
  try{
    await fetch(CONFIG.SHEETS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ email: state.user.email, name: state.user.name, data: { topics: state.topics, theme: state.theme } }),
    });
    state.lastSynced = new Date();
  }catch(e){ console.error("sheet sync failed", e); }
  state.syncing = false;
}

async function loadFromSheet(){
  if(!CONFIG.SHEETS_WEBAPP_URL || !state.user) return;
  try{
    const res = await fetch(CONFIG.SHEETS_WEBAPP_URL + "?email=" + encodeURIComponent(state.user.email));
    const json = await res.json();
    if(json && json.topics && json.topics.length){
      state.topics = json.topics;
      if(json.theme) state.theme = json.theme;
      applyTheme();
    }
  }catch(e){ console.error("sheet load failed", e); }
}

function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
}

function toggleTheme(){
  state.theme = state.theme === "light" ? "dark" : "light";
  applyTheme();
  saveState();
  render();
}

/* ---------- derived helpers ---------- */
function topicsForDay(day){ return state.topics.filter(t => t.day === day); }
function topicsForSubject(code){ return state.topics.filter(t => t.code === code); }
function incompleteTopics(){ return state.topics.filter(t => t.status !== "complete"); }
function completionPct(list){
  if(!list.length) return 0;
  const done = list.filter(t => t.status === "complete").length;
  return Math.round((done/list.length)*100);
}
function findTopic(id){ return state.topics.find(t => t.id === id); }

function setStatus(id, status){
  const t = findTopic(id);
  if(!t) return;
  t.status = status;
  saveState();
  render();
}

function toggleComplete(id){
  const t = findTopic(id);
  if(!t) return;
  t.status = t.status === "complete" ? "not_started" : "complete";
  saveState();
  render();
}

function deleteTopic(id){
  state.topics = state.topics.filter(t => t.id !== id);
  state.modal = null;
  saveState();
  render();
}

function upsertTopicFromModal(){
  const m = state.modal;
  const name = document.getElementById("f-name").value.trim();
  const code = document.getElementById("f-subject").value;
  const day = Number(document.getElementById("f-day").value);
  const status = document.getElementById("f-status").value;
  const priority = document.getElementById("f-priority").value;
  if(!name) return;
  if(m.mode === "new"){
    const id = "t" + Date.now();
    state.topics.push({ id, day, code, name, status, priority });
  } else {
    const t = findTopic(m.topic.id);
    if(t){ t.name = name; t.code = code; t.day = day; t.status = status; t.priority = priority; }
  }
  state.modal = null;
  saveState();
  render();
}

function openNewTopic(defaultDay, defaultCode){
  state.modal = { mode:"new", topic:{ day:defaultDay||1, code:defaultCode||"PS", status:"not_started", priority:"normal", name:"" } };
  render();
}
function openEditTopic(id){
  const t = findTopic(id);
  if(!t) return;
  state.modal = { mode:"edit", topic: t };
  render();
}
function closeModal(){ state.modal = null; render(); }

/* ============================= ICONS ============================= */
const ICONS = {
  calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3V4Z"/><path d="M16 4h4v16h-4"/></svg>`,

function topicRow(t, opts){

  return `

    <button class="checkbox ${checked?'checked':''}" onclick="event.stopPropagation(); toggleComplete('${t.id}')" aria-label="toggle complete">${ICONS.check}</button>

/* ---------- SYLLABUS ---------- */
function matchesFilter(t){
  if(state.filter === "complete") return t.status === "complete";
  if(state.filter === "in_progress") return t.status === "in_progress" || t.status === "partial";
  if(state.filter === "incomplete") return t.status !== "complete";
  return true;
}
function matchesSearch(t){
  if(!state.search.trim()) return true;
  return t.name.toLowerCase().includes(state.search.trim().toLowerCase());
}

function onSearchInput(v){ state.search = v; render(true); }
function onFilterChange(v){ state.filter = v; render(); }
function onSubjectFilterChange(v){ state.subjectFilter = v; render(); }
function toggleSubject(code){ state.syllabusExpanded[code] = !state.syllabusExpanded[code]; render(); }

function pageSyllabus(){
  const codes = Object.keys(SUBJECT_META).filter(c => topicsForSubject(c).length &&
    (state.subjectFilter === "all" || state.subjectFilter === c));

  return `
  <section class="block edge">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:30px;">
      <h1 class="display display-lg">FULL<br/>SYLLABUS</h1>
      <button class="btn" onclick="openNewTopic(1, 'PS')">+ ADD TOPIC</button>
    </div>
    <div class="toolbar">
      <input id="syllabus-search" class="search-input" type="text" placeholder="SEARCH TOPICS…" value="${state.search.replace(/"/g,'&quot;')}" oninput="onSearchInput(this.value)" />
      <select class="plain" onchange="onSubjectFilterChange(this.value)">
        <option value="all" ${state.subjectFilter==='all'?'selected':''}>ALL SUBJECTS</option>
        ${Object.keys(SUBJECT_META).map(c => `<option value="${c}" ${state.subjectFilter===c?'selected':''}>${SUBJECT_META[c].name.toUpperCase()}</option>`).join("")}
      </select>
      <select class="plain" onchange="onFilterChange(this.value)">
        <option value="all" ${state.filter==='all'?'selected':''}>SHOW ALL</option>
        <option value="complete" ${state.filter==='complete'?'selected':''}>COMPLETED</option>
        <option value="in_progress" ${state.filter==='in_progress'?'selected':''}>IN PROGRESS</option>
        <option value="incomplete" ${state.filter==='incomplete'?'selected':''}>INCOMPLETE</option>
      </select>
    </div>

    ${codes.map(code => {
      const all = topicsForSubject(code);
      const shown = all.filter(t => matchesFilter(t) && matchesSearch(t));
      const pct = completionPct(all);
      const done = all.filter(t=>t.status==='complete').length;
      const open = !!state.syllabusExpanded[code] || state.search.trim().length > 0;
      return `
      <div class="subj-card">
        <div class="subj-head" onclick="toggleSubject('${code}')">
          <div class="l">
            <div class="display display-md">${SUBJECT_META[code].name}</div>
            <span class="label">${done}/${all.length} TOPICS COMPLETE</span>
          </div>
          <div class="subj-stats">
            <span class="num" style="font-size:28px; color:var(--cobalt);">${pct}%</span>
            <span class="chev ${open?'open':''}">${ICONS.arrow.replace('M5 12h14M13 6l6 6-6 6','M6 9l6 6 6-6')}</span>
          </div>
        </div>
        <div class="subj-body ${open?'open':''}">
          <div class="bar" style="margin-bottom:8px;"><div style="width:${pct}%;"></div></div>
          <div style="padding-bottom:22px;">
            ${shown.length === 0 ? `<div class="label" style="padding:16px 2px;">NO TOPICS MATCH THIS FILTER.</div>` :
              shown.map((t,i) => topicRow(t, {num:String(i+1).padStart(2,'0'), prefix:'DAY 0'+t.day})).join("")}
          </div>
        </div>
      </div>`;
    }).join("")}
  </section>
  `;
}

      </div>
    </div>
    <div style="margin-top:34px;">
      <a class="reset-link" onclick="resetProgress()">RESET ALL PROGRESS</a>
    </div>
  </section>
  `;
}

function resetProgress(){
  state.topics.forEach(t => t.status = "not_started");
  saveState();
  render();
}

/* ---------- MODAL ---------- */
function renderModal(){
  if(!state.modal) return "";
  const m = state.modal;
  const t = m.topic;
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${m.mode==='new' ? 'ADD TOPIC' : 'EDIT TOPIC'}</h3>
      <div class="field">
        <label>TOPIC NAME</label>
        <input id="f-name" type="text" value="${(t.name||'').replace(/"/g,'&quot;')}" placeholder="e.g. Bayes' Theorem" />
      </div>
      <div class="field">
        <label>SUBJECT</label>
        <select id="f-subject">
          ${Object.keys(SUBJECT_META).map(c => `<option value="${c}" ${t.code===c?'selected':''}>${SUBJECT_META[c].name}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>STUDY DAY</label>
        <select id="f-day">
          ${[1,2,3,4].map(d => `<option value="${d}" ${t.day===d?'selected':''}>DAY 0${d} — ${DAY_META[d].label}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>STATUS</label>
        <select id="f-status">
          ${STATUS_ORDER.map(s => `<option value="${s}" ${t.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>PRIORITY</label>
        <select id="f-priority">
          <option value="normal" ${t.priority==='normal'?'selected':''}>NORMAL</option>
          <option value="high" ${t.priority==='high'?'selected':''}>HIGH PRIORITY</option>
        </select>
      </div>
      <div class="modal-actions">
        <div>${m.mode==='edit' ? `<button class="btn btn-ghost" onclick="deleteTopic('${t.id}')">DELETE</button>` : ''}</div>
        <div class="right">
          <button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>
          <button class="btn" onclick="upsertTopicFromModal()">SAVE</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================= ROUTER / RENDER ============================= */
function pageFor(route){
  switch(route){
    case "home": return pageHome();
    case "days": return pageDays();
    case "schedule": return pageSchedule();
    case "syllabus": return pageSyllabus();
    case "progress": return pageProgress();
    case "settings": return pageSettings();
    default: return pageHome();
  }
}

function render(preserveFocus){
  if(!state.ready) return;
  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id;
  const selStart = activeEl && activeEl.selectionStart;

  document.getElementById("app").innerHTML = `
    ${topBar()}
    <main style="max-width:1400px; margin:0 auto;">
      ${pageFor(state.route)}
    </main>
    ${bottomNav()}
    ${renderModal()}
  `;

  if(preserveFocus && focusId){
    const el = document.getElementById(focusId);
    if(el){ el.focus(); if(selStart != null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }

  if(!state.user) setTimeout(initGoogleAuth, 0);
}

loadState();
</script>
</body>
</html>
